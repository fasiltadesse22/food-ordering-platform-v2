name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify root reactor
        run: mvn -B -ntp verify

      - name: Verify P18 process restart durability experiment
        run: experiments/cluster-1.1/p18-process-restart-durability.sh
